name: AirBand
options:
  bundleIdPrefix: com.lukaswinter
  deploymentTarget:
    iOS: '18.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    SUPPORTS_MACCATALYST: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 3N88SJUYYR
    SWIFT_OBJC_BRIDGING_HEADER: AirBand/Audio/AirBand-Bridging-Header.h
    CLANG_ENABLE_MODULES: YES
targets:
  AirBand:
    type: application
    platform: iOS
    sources: [AirBand]
    info:
      path: AirBand/Info.plist
      properties:
        CFBundleDisplayName: AirBand
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: AirBand uses your camera to turn hand movements and facial expressions into music. Camera images stay on your device.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        UIRequiredDeviceCapabilities: [arm64]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lukaswinter.AirBand
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  AirBand:
    build:
      targets:
        AirBand: all
    run:
      config: Debug
